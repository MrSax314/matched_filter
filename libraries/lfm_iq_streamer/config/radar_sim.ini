# ---------------------------------------------------------------------------
# LFM IQ Streamer configuration
# Units are SI unless noted. Comments start with '#' or ';'.
# Add as many [target] sections as you like; each one is a new point target.
# ---------------------------------------------------------------------------

[network]
host               = 127.0.0.1
port               = 50000
samples_per_packet = 128        ; 128*8 + 40 = 1064-byte datagrams (fits a 1500-byte MTU)

[waveform]
sample_rate_hz  = 2.0e6         ; complex (IQ) sample rate fs
carrier_freq_hz = 3.0e9         ; RF carrier fc, used for Doppler / carrier phase
bandwidth_hz    = 1.0e6         ; chirp sweep B, from -B/2 to +B/2
pulse_width_s   = 50e-6         ; pulse duration T
pri_s           = 500e-6        ; pulse repetition interval (PRF = 2 kHz)

[noise]
enabled        = true
noise_power_db = 0.0            ; complex noise power per sample, dB rel. 1.0
seed           = 12345          ; 0 = different random noise every run

[stream]
realtime         = true         ; pace output to the sample rate
max_pulses       = 0            ; 0 = stream forever
stats_interval_s = 1.0          ; 0 = silent

[target]
name         = aircraft
range_m      = 12000            ; range at pulse 0
velocity_mps = -25              ; radial; negative = approaching
snr_db       = -5               ; per-sample SNR before matched filtering

[target]
name         = drone
range_m      = 30000
velocity_mps = 15
snr_db       = -10
